<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro de Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#1a1a1a; --muted:#7a7a7a; --line:#e3e3e3; --icon:#b5b5b5;
  --on:#1a1a1a; --ok:#2e7d4f; --bad:#b3261e; --wait:#9a7b1c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;min-height:100vh;padding:40px 16px 56px}
.wrap{max-width:820px;margin:0 auto}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:20px;margin-bottom:28px;border-bottom:1px solid var(--line)}
h1{font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0}
h1 br{display:none}
h1 em{font-style:normal}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;font-size:13px;color:var(--muted)}
.status div{display:flex;align-items:center;gap:7px}
.led{width:7px;height:7px;border-radius:50%;background:var(--icon)}
.led.ok{background:var(--ok)}
.led.bad{background:var(--bad)}
.led.wait{background:var(--wait);animation:pisca 1s steps(2) infinite}
@keyframes pisca{50%{opacity:.25}}

.quadro{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.placa{
  border:1px solid var(--line);border-radius:6px;padding:16px;background:#fff;
  display:grid;grid-template-columns:1fr auto;gap:10px 12px;transition:border-color .2s;
}
.placa.on{border-color:var(--ink)}
.parafuso{display:none}

.visor{grid-column:1/-1;aspect-ratio:1.5;display:grid;place-items:center}
.visor svg{width:78%;height:78%}

.nome{font-weight:500;font-size:16px;line-height:1.25;margin:0}
.canal{font-size:12px;color:var(--muted);margin-top:2px}
.estado{grid-column:1;font-size:13px;color:var(--muted)}
.placa.on .estado{color:var(--ink)}
.placa.pendente .estado{animation:pisca .6s steps(2) infinite}

/* Interruptor */
.alavanca{
  grid-column:2;grid-row:2/4;align-self:center;position:relative;
  width:44px;height:24px;padding:0;border:0;border-radius:12px;cursor:pointer;
  background:#d6d6d6;transition:background .2s;
}
.manopla{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.placa.on .alavanca{background:var(--on)}
.placa.on .manopla{transform:translateX(20px)}
.alavanca:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.placa.nega{animation:treme .3s}
@keyframes treme{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* Ícones */
.ic *{fill:none;stroke:var(--icon);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:all .3s}
.placa.on .ic *{stroke:var(--on)}
.ic .raios{opacity:0}
.placa.on .ic .bulbo{fill:#f3e3b5}
.placa.on .ic .raios{opacity:1}
.ic .pas{transform-box:view-box;transform-origin:50px 44px}
.ic .pas path{fill:var(--icon);stroke:none}
.placa.on .ic .pas path{fill:var(--on)}
.placa.on .ic .pas{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.ic .gota{stroke:none;fill:var(--on);opacity:0}
.placa.on .ic .gota{animation:pinga 1.2s ease-in infinite}
.placa.on .ic .gota:nth-of-type(2){animation-delay:.4s}
.placa.on .ic .gota:nth-of-type(3){animation-delay:.8s}
@keyframes pinga{0%{opacity:0;transform:translateY(-8px)}20%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
.ic .faisca{opacity:0}
.ic .furo{fill:var(--icon);stroke:none}
.placa.on .ic .furo{fill:var(--on)}
.placa.on .ic .faisca{opacity:1;fill:var(--on);stroke:none}
.ic .onda{opacity:0}
.placa.on .ic .onda{animation:sobe 2s ease-out infinite}
.placa.on .ic .onda.o2{animation-delay:.5s}
.placa.on .ic .onda.o3{animation-delay:1s}
@keyframes sobe{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.placa.servo .graus{grid-column:2;grid-row:2;align-self:center;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.placa.servo.pendente .graus{font-size:13px;color:var(--muted);animation:pisca .6s steps(2) infinite}
.placa.servo .controle{grid-column:1/-1;display:grid;gap:10px}
.placa.servo input[type=range]{width:100%;accent-color:var(--ink)}
.placa.servo .atalhos{display:flex;gap:6px}
.placa.servo .atalhos button{flex:1;padding:6px 0;border:1px solid var(--line);border-radius:4px;background:#fff;
  font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.placa.servo .atalhos button:active{background:#f2f2f2}
.placa.servo .ic .braco{stroke:var(--on);stroke-width:4;transition:transform .4s}
.placa.servo .ic .eixo{fill:var(--on);stroke:none}

/* Login */
dialog{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:24px;width:min(340px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.3)}
dialog h2{font-weight:500;font-size:18px;margin:0 0 6px}
dialog p{font-size:13px;color:var(--muted);margin:0 0 16px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;color:var(--ink);background:#fff}
.lembrar{display:flex;align-items:center;gap:8px;margin-top:14px}
.btn{margin-top:18px;width:100%;padding:10px;border:0;border-radius:4px;background:var(--ink);color:#fff;font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer}
.erro{color:var(--bad);font-size:13px;min-height:16px;margin-top:10px}
.sair{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:0}

.aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;
  background:var(--ink);color:#fff;padding:9px 14px;border-radius:4px;font-size:13px;
  transition:all .2s;pointer-events:none;max-width:calc(100% - 32px)}
.aviso.vis{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* relé e LED */
.ic .contato{transform-box:view-box;transform-origin:34px 62px;transition:transform .25s}
.placa.on .ic .contato{transform:rotate(-14deg)}
.ic .bobina{fill:none}
.placa.on .ic .bobina{fill:#ededed}
.ic .luz{opacity:0}
.placa.on .ic .cupula{fill:#f3e3b5}
.placa.on .ic .luz{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Quadro de comando</h1>
    <div class="status">
      <div><span class="led" id="ledServidor"></span><span id="txtServidor">servidor: desconectado</span></div>
      <div><span class="led" id="ledPlaca"></span><span id="txtPlaca">placa: aguardando</span></div>
    </div>
  </header>
  <main class="quadro" id="quadro"></main>
</div>

<div class="aviso" id="aviso"></div>

<script>
/* ================== CONFIGURAÇÃO ================== */
const CONFIG = {
  servidor: "https://ntfy.sh",
  prefixo: "mateus-vq1s0prx3td7bc",   // igual ao PREFIXO do sketch
  pulsoMin: 15,                       // igual ao PULSO_MS do sketch, em minutos
  // tipo: "r" = relé, "l" = LED, "s" = servo. A ordem de r e l deve seguir o sketch.
  itens: [
    { tipo: "r", n: 1, nome: "Relé 1", pino: 2 },
    { tipo: "r", n: 2, nome: "Relé 2", pino: 3 },
    { tipo: "l", n: 1, nome: "LED 1",  pino: 6 },
    { tipo: "l", n: 2, nome: "LED 2",  pino: 7 },
    { tipo: "s", n: 1, nome: "Porta",  pino: 9,  atalhos: [0, 90, 180] },
    { tipo: "s", n: 2, nome: "Janela", pino: 10, atalhos: [0, 90, 180] },
  ]
};
/* ================================================== */

const ICONES = {
  r: `<svg viewBox="0 0 100 100" class="ic">
    <rect class="bobina" x="14" y="20" width="26" height="30" rx="3"/>
    <path d="M18 28h18M18 35h18M18 42h18"/>
    <path d="M27 50v12"/>
    <circle cx="34" cy="62" r="3"/>
    <path class="contato" d="M34 62h40"/>
    <circle cx="80" cy="54" r="3"/>
    <path d="M10 62h21M83 54h10M80 57v0"/>
    <path d="M27 78h46"/></svg>`,
  l: `<svg viewBox="0 0 100 100" class="ic">
    <g class="luz"><path d="M50 6v8M22 18l6 6M78 18l-6 6M10 46h8M90 46h-8"/></g>
    <path class="cupula" d="M32 64V40a18 18 0 0 1 36 0v24z"/>
    <path d="M26 64h48"/>
    <path d="M42 64v26M58 64v20"/></svg>`,
};

const $ = id => document.getElementById(id);
const URL_CMD    = `${CONFIG.servidor}/${CONFIG.prefixo}-cmd`;
const URL_ESTADO = `${CONFIG.servidor}/${CONFIG.prefixo}-estado`;
const NUM_RELES  = CONFIG.itens.filter(i => i.tipo === "r").length;
let ultimaVista = 0;
const timers = {}, pendente = {};

/* --- Monta o quadro --- */
for (const it of CONFIG.itens) {
  const id = it.tipo + it.n;
  const el = document.createElement("article");
  el.id = "card-" + id;
  if (it.tipo === "s") {
    el.className = "placa servo";
    const marcas = [0, 45, 90, 135, 180].map(a =>
      `<line x1="12" y1="70" x2="18" y2="70" transform="rotate(${a} 50 70)"/>`).join("");
    el.innerHTML = `
      <div class="visor"><svg viewBox="0 0 100 100" class="ic">
        <path d="M10 70a40 40 0 0 1 80 0"/>${marcas}
        <line class="braco" x1="50" y1="70" x2="16" y2="70"/>
        <circle cx="50" cy="70" r="5" class="eixo"/>
        <rect x="30" y="76" width="40" height="14" rx="2"/>
      </svg></div>
      <div><h2 class="nome">${it.nome}</h2><div class="canal">pino ${it.pino}</div></div>
      <div class="graus">${0}°</div>
      <div class="controle">
        <input type="range" min="0" max="180" step="1" value="0" aria-label="Ângulo — ${it.nome}">
        <div class="atalhos">${it.atalhos.map(a => `<button data-a="${a}">${a}°</button>`).join("")}</div>
      </div>`;
    const r = el.querySelector("input");
    r.addEventListener("input", () => desenharServo(id, Number(r.value), true));
    r.addEventListener("change", () => moverServo(id, Number(r.value)));
    el.querySelectorAll(".atalhos button").forEach(b =>
      b.addEventListener("click", () => moverServo(id, Number(b.dataset.a))));
  } else {
    el.className = "placa";
    el.innerHTML = `
      <div class="visor">${ICONES[it.tipo]}</div>
      <div><h2 class="nome">${it.nome}</h2><div class="canal">pino ${it.pino}</div></div>
      <button class="alavanca" role="switch" aria-checked="false" aria-label="${it.nome}"><span class="manopla"></span></button>
      <div class="estado">${it.tipo === "l" ? "apagado" : "desligado"}</div>`;
    el.querySelector(".alavanca").addEventListener("click", () => alternar(id));
  }
  $("quadro").appendChild(el);
}

const rotulo = (id, ligado) => id[0] === "l" ? (ligado ? "aceso" : "apagado") : (ligado ? "ligado" : "desligado");

/* --- Relés e LEDs --- */
function setChave(id, ligado) {
  const el = $("card-" + id);
  if (!el) return;
  if (id in pendente && pendente[id] !== ligado) return;   // ainda esperando a confirmação
  delete pendente[id];
  clearTimeout(timers[id]);
  el.classList.remove("pendente");
  el.classList.toggle("on", ligado);
  el.querySelector(".alavanca").setAttribute("aria-checked", ligado);
  el.querySelector(".estado").textContent = rotulo(id, ligado);
}

async function alternar(id) {
  const el = $("card-" + id);
  const ligar = !el.classList.contains("on");
  pendente[id] = ligar;
  el.classList.add("pendente");
  el.querySelector(".estado").textContent = id[0] === "l" ? (ligar ? "acendendo…" : "apagando…") : (ligar ? "ligando…" : "desligando…");
  await enviar(id, `${id}=${ligar ? 1 : 0}`);
}

/* --- Servos --- */
function desenharServo(id, a, previa) {
  const el = $("card-" + id);
  el.querySelector(".braco").setAttribute("transform", `rotate(${a} 50 70)`);
  el.querySelector(".graus").textContent = a + "°";
  if (!previa) el.querySelector("input").value = a;
}

function setServo(id, a) {
  const el = $("card-" + id);
  if (!el) return;
  if (id in pendente && pendente[id] !== a) return;
  delete pendente[id];
  clearTimeout(timers[id]);
  el.classList.remove("pendente");
  el.classList.toggle("on", a !== 0);
  desenharServo(id, a);
}

async function moverServo(id, a) {
  const el = $("card-" + id);
  pendente[id] = a;
  el.classList.add("pendente");
  desenharServo(id, a, true);
  el.querySelector(".graus").textContent = `indo para ${a}°…`;
  await enviar(id, `${id}=${a}`);
}

/* --- Envio e falhas --- */
async function enviar(id, corpo) {
  try {
    const r = await fetch(URL_CMD, { method: "POST", body: corpo });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    cancelar(id, "Não foi possível enviar o comando.");
    return;
  }
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => cancelar(id, "A placa não confirmou o comando."), 15000);
}

function cancelar(id, msg) {
  const el = $("card-" + id);
  delete pendente[id];
  el.classList.remove("pendente");
  if (id[0] === "s") {
    const a = Number(el.dataset.real || 0);
    desenharServo(id, a);
  } else {
    el.querySelector(".estado").textContent = rotulo(id, el.classList.contains("on"));
  }
  el.classList.remove("nega"); void el.offsetWidth; el.classList.add("nega");
  avisar(msg);
}

/* --- Estado vindo da placa: "RRLL:A1:A2", ex.: "1001:90:0" --- */
function aplicarEstado(texto, tempoSeg) {
  const partes = texto.split(":");
  const bits = partes[0];
  if (!/^[01]+$/.test(bits)) return;
  for (const it of CONFIG.itens) {
    const id = it.tipo + it.n;
    if (it.tipo === "r" && bits[it.n - 1] !== undefined) setChave(id, bits[it.n - 1] === "1");
    if (it.tipo === "l" && bits[NUM_RELES + it.n - 1] !== undefined) setChave(id, bits[NUM_RELES + it.n - 1] === "1");
    if (it.tipo === "s" && partes[it.n] !== undefined) {
      const a = Number(partes[it.n]);
      $("card-" + id).dataset.real = a;
      setServo(id, a);
    }
  }
  ultimaVista = Math.max(ultimaVista, tempoSeg * 1000);
  atualizarPlaca();
}

/* --- Indicadores --- */
function setServidor(estado) {
  $("ledServidor").className = "led " + estado;
  $("txtServidor").textContent = "servidor: " + ({ ok: "conectado", wait: "conectando…", bad: "desconectado" }[estado]);
}

function atualizarPlaca() {
  if (!ultimaVista) {
    $("ledPlaca").className = "led";
    $("txtPlaca").textContent = "placa: sem notícias";
    return;
  }
  const min = Math.floor((Date.now() - ultimaVista) / 60000);
  const online = min <= CONFIG.pulsoMin + 2;
  $("ledPlaca").className = "led " + (online ? "ok" : "bad");
  $("txtPlaca").textContent = "placa: " + (online ? "online" : "offline") +
    (min < 1 ? " (agora)" : ` (há ${min} min)`);
}
setInterval(atualizarPlaca, 30000);

let avisoT;
function avisar(txt) {
  const a = $("aviso");
  a.textContent = txt; a.classList.add("vis");
  clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove("vis"), 2600);
}

/* --- Conexão com o ntfy --- */
async function carregarUltimo() {
  try {
    const r = await fetch(`${URL_ESTADO}/json?poll=1&since=latest`);
    const linhas = (await r.text()).trim().split("\n").filter(Boolean);
    for (const l of linhas) {
      const d = JSON.parse(l);
      if (d.event === "message") aplicarEstado(d.message.trim(), d.time);
    }
  } catch (e) {}
  atualizarPlaca();
}

function ouvir() {
  setServidor("wait");
  const es = new EventSource(`${URL_ESTADO}/sse`);
  es.onopen = () => setServidor("ok");
  es.onerror = () => setServidor(es.readyState === EventSource.CLOSED ? "bad" : "wait");
  es.onmessage = ev => {
    try {
      const d = JSON.parse(ev.data);
      if (d.event === "message") aplicarEstado(d.message.trim(), d.time);
    } catch (e) {}
  };
}

carregarUltimo();
ouvir();
</script>
</body>
</html>
